name: Yumeiro UI Preview APK

on:
  push:
    branches:
      - streaming-only-refactor
    paths:
      - ".github/workflows/ui-preview-apk.yml"
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradle/libs.versions.toml"

permissions:
  contents: read

concurrency:
  group: yumeiro-ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-apk:
    name: Build installable preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "21.0.13"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Assemble mobile preview APK
        run: ./gradlew assembleMobilePreview --no-daemon

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/mobile/preview/app-mobile-preview.apk
          ls -lh app/build/outputs/apk/mobile/preview/*.apk

      - name: Upload installable preview APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Yumeiro-UI-Preview-APK
          path: app/build/outputs/apk/mobile/preview/*.apk
          retention-days: 14
